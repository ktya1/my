{% extends 'base.html' %}

{% block title %} POSTS {% endblock %}
{% block links %} {% endblock %}


{% block content %} 
<div class="posts">
    {% for post in posts %}
        <article class="post">
            <h2>
                {{post.title}}
            </h2>

            <p>
                {{ post.content }}
            </p>
        </article>

    {% else %}
            <p>постов нет</p>
    {% endfor %}
</div>

{% endblock %}
